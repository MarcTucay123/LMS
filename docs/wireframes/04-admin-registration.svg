<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
<title>Administrator registration</title>
<rect width="100%" height="100%" fill="#f4f4f3"/>
<style>text{font-family:Arial,sans-serif;fill:#686868}.title{font-size:24px;font-weight:700;fill:#555}.h2{font-size:17px;font-weight:700;fill:#606060}.label{font-size:12px;font-weight:700;fill:#777}.small{font-size:11px;fill:#888}.tiny{font-size:9px;fill:#999}.button{font-size:12px;font-weight:700;fill:#fff}.nav{font-size:12px;fill:#777}.active{font-weight:700;fill:#555}</style>
<rect x="0" y="0" width="900" height="980" rx="0" fill="#e9e9e7" stroke="none" stroke-width="1"/>
<circle cx="450" cy="65" r="25" fill="#d0d0d0" stroke="#c8c8c8"/>
<text x="450" y="108" class="title" text-anchor="middle">ADFC OneCampus</text>
<text x="450" y="130" class="small" text-anchor="middle">Learning Management System</text>
<rect x="210" y="155" width="480" height="755" rx="12" fill="#fff" stroke="#c8c8c8" stroke-width="1"/>
<text x="250" y="203" class="title" text-anchor="start">Administrator registration</text>
<text x="250" y="227" class="small" text-anchor="start">Submit an application for administrator approval.</text>
<text x="250" y="265" class="h2" text-anchor="start">Personal name</text>
<text x="250" y="293" class="label" text-anchor="start">First name</text>
<rect x="250" y="300" width="190" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="325" class="small" text-anchor="start">First name</text>
<text x="460" y="293" class="label" text-anchor="start">Middle name</text>
<rect x="460" y="300" width="190" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="472" y="325" class="small" text-anchor="start">Optional</text>
<text x="250" y="368" class="label" text-anchor="start">Last name</text>
<rect x="250" y="375" width="190" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="400" class="small" text-anchor="start">Last name</text>
<text x="460" y="368" class="label" text-anchor="start">Suffix</text>
<rect x="460" y="375" width="190" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="472" y="400" class="small" text-anchor="start">Optional</text>
<text x="250" y="453" class="label" text-anchor="start">Email address</text>
<rect x="250" y="460" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="485" class="small" text-anchor="start">name@example.com</text>
<text x="250" y="533" class="label" text-anchor="start">Create password</text>
<rect x="250" y="540" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="565" class="small" text-anchor="start">••••••••</text>
<text x="250" y="613" class="label" text-anchor="start">Confirm password</text>
<rect x="250" y="620" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="645" class="small" text-anchor="start">••••••••</text>
<rect x="250" y="690" width="360" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
<rect x="250" y="702" width="300" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
<rect x="250" y="730" width="400" height="40" rx="5" fill="#8b8b8b" stroke="#8b8b8b" stroke-width="1"/>
<text x="450.0" y="755" class="button" text-anchor="middle">Register as Administrator</text>
<text x="450" y="805" class="small" text-anchor="middle">Already registered? Back to administrator sign in</text>
</svg>