<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
<title>Reset your password</title>
<rect width="100%" height="100%" fill="#f4f4f3"/>
<style>text{font-family:Arial,sans-serif;fill:#686868}.title{font-size:24px;font-weight:700;fill:#555}.h2{font-size:17px;font-weight:700;fill:#606060}.label{font-size:12px;font-weight:700;fill:#777}.small{font-size:11px;fill:#888}.tiny{font-size:9px;fill:#999}.button{font-size:12px;font-weight:700;fill:#fff}.nav{font-size:12px;fill:#777}.active{font-weight:700;fill:#555}</style>
<rect x="0" y="0" width="900" height="800" rx="0" fill="#e9e9e7" stroke="none" stroke-width="1"/>
<circle cx="450" cy="65" r="25" fill="#d0d0d0" stroke="#c8c8c8"/>
<text x="450" y="108" class="title" text-anchor="middle">ADFC OneCampus</text>
<text x="450" y="130" class="small" text-anchor="middle">Learning Management System</text>
<rect x="210" y="155" width="480" height="500" rx="12" fill="#fff" stroke="#c8c8c8" stroke-width="1"/>
<text x="250" y="203" class="title" text-anchor="start">Reset your password</text>
<text x="250" y="227" class="small" text-anchor="start">Choose a new secure password.</text>
<text x="250" y="260" class="small" text-anchor="start">← Back to sign in</text>
<text x="250" y="308" class="label" text-anchor="start">New password</text>
<rect x="250" y="315" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="340" class="small" text-anchor="start">••••••••</text>
<text x="250" y="388" class="label" text-anchor="start">Confirm new password</text>
<rect x="250" y="395" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="420" class="small" text-anchor="start">••••••••</text>
<rect x="250" y="460" width="340" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
<rect x="250" y="471" width="275" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
<rect x="250" y="505" width="400" height="40" rx="5" fill="#8b8b8b" stroke="#8b8b8b" stroke-width="1"/>
<text x="450.0" y="530" class="button" text-anchor="middle">Reset password</text>
</svg>