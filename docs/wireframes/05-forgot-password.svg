<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800">
<title>Forgot password?</title>
<rect width="100%" height="100%" fill="#f4f4f3"/>
<style>text{font-family:Arial,sans-serif;fill:#686868}.title{font-size:24px;font-weight:700;fill:#555}.h2{font-size:17px;font-weight:700;fill:#606060}.label{font-size:12px;font-weight:700;fill:#777}.small{font-size:11px;fill:#888}.tiny{font-size:9px;fill:#999}.button{font-size:12px;font-weight:700;fill:#fff}.nav{font-size:12px;fill:#777}.active{font-weight:700;fill:#555}</style>
<rect x="0" y="0" width="900" height="800" rx="0" fill="#e9e9e7" stroke="none" stroke-width="1"/>
<circle cx="450" cy="65" r="25" fill="#d0d0d0" stroke="#c8c8c8"/>
<text x="450" y="108" class="title" text-anchor="middle">ADFC OneCampus</text>
<text x="450" y="130" class="small" text-anchor="middle">Learning Management System</text>
<rect x="210" y="155" width="480" height="500" rx="12" fill="#fff" stroke="#c8c8c8" stroke-width="1"/>
<text x="250" y="203" class="title" text-anchor="start">Forgot password?</text>
<text x="250" y="227" class="small" text-anchor="start">Receive a secure password-reset link.</text>
<text x="250" y="260" class="small" text-anchor="start">← Back to sign in</text>
<text x="250" y="323" class="label" text-anchor="start">Email address</text>
<rect x="250" y="330" width="400" height="42" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1"/>
<text x="262" y="355" class="small" text-anchor="start">registered@example.com</text>
<rect x="250" y="410" width="400" height="40" rx="5" fill="#8b8b8b" stroke="#8b8b8b" stroke-width="1"/>
<text x="450.0" y="435" class="button" text-anchor="middle">Send reset link</text>
<rect x="250" y="480" width="400" height="80" rx="6" fill="#f4f4f4" stroke="#d0d0d0" stroke-width="1"/>
<text x="270" y="505" class="label" text-anchor="start">Confirmation message appears here</text>
<rect x="270" y="523" width="330" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
<rect x="270" y="534" width="280" height="4" rx="2" fill="#c8c8c8" stroke="none" stroke-width="1"/>
</svg>